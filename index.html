<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon.......</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --paper:#F4EEDF;
    --paper-2:#ECE2C9;
    --paper-shadow:#D9C9A0;
    --ink:#242B2E;
    --ink-soft:#565B52;
    --postal-red:#A13A2C;
    --postal-green:#5B6B4F;
    --brass:#9C7A3C;
    --line:#C9B896;
    --line-soft:#DCCDA6;
    --white-fleck:#FBF8F0;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(161,58,44,0.04), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(91,107,79,0.05), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }

  .container{max-width:760px;margin:0 auto;padding:0 20px;}

  /* ---------- Postmark signature element ---------- */
  .postmark{
    width:92px;height:92px;border-radius:50%;
    border:2px solid var(--ink-soft);
    position:relative;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier Prime', monospace;
    color:var(--ink-soft);
    opacity:0.75;
  }
  .postmark::before{
    content:"";position:absolute;inset:6px;border-radius:50%;
    border:1px dashed var(--ink-soft);
  }
  .postmark .pm-text{
    text-align:center;font-size:8.5px;letter-spacing:1.5px;line-height:1.5;text-transform:uppercase;
  }
  .postmark .pm-lines{
    position:absolute;left:-14px;top:50%;width:34px;height:0;
    border-top:1.5px solid var(--ink-soft);
    transform:rotate(-18deg);
  }
  .postmark .pm-lines::after{
    content:"";position:absolute;top:6px;left:0;width:100%;height:0;border-top:1.5px solid var(--ink-soft);
  }
  .postmark .pm-lines2{
    position:absolute;right:-14px;top:50%;width:34px;height:0;
    border-top:1.5px solid var(--ink-soft);
    transform:rotate(18deg);
  }
  .postmark .pm-lines2::after{
    content:"";position:absolute;top:6px;right:0;width:100%;height:0;border-top:1.5px solid var(--ink-soft);
  }

  /* ---------- Hero ---------- */
  .hero{
    padding:64px 0 40px;
    text-align:center;
    position:relative;
  }
  .hero-postmark{display:flex;justify-content:center;margin-bottom:22px;}
  .hero-postmark .postmark{width:104px;height:104px;}
  .eyebrow{
    font-family:'Courier Prime', monospace;
    font-size:11.5px;letter-spacing:3px;text-transform:uppercase;
    color:var(--postal-red);margin:0 0 14px;
  }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(38px, 7vw, 62px);
    letter-spacing:-0.01em;
    margin:0 0 10px;
    color:var(--ink);
  }
  .title em{font-style:italic;font-weight:450;color:var(--postal-red);}
  .subtitle{
    font-family:'Fraunces', serif;font-style:italic;font-weight:450;
    font-size:19px;color:var(--ink-soft);max-width:480px;margin:0 auto 34px;
  }
  .hero-note{
    font-family:'Caveat', cursive;font-weight:700;
    font-size:27px;color:var(--ink);
    max-width:440px;margin:0 auto 6px;line-height:1.3;
  }
  .hero-body{
    max-width:460px;margin:14px auto 36px;color:var(--ink-soft);font-size:16px;
  }
  .hero-body .line{margin:2px 0;}

  .cta-btn{
    font-family:'Courier Prime', monospace;
    font-size:13.5px;letter-spacing:2px;text-transform:uppercase;
    background:var(--ink);color:var(--paper);
    border:none;padding:16px 34px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:10px;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .cta-btn:hover{background:var(--postal-red);transform:translateY(-1px);}
  .cta-btn:active{transform:translateY(0);}
  .cta-btn:focus-visible{outline:2px solid var(--postal-red);outline-offset:3px;}

  /* four stamps row */
  .stamps-row{
    display:flex;justify-content:center;gap:16px;margin:46px auto 8px;flex-wrap:wrap;
  }
  .stamp{
    width:76px;height:92px;
    background:var(--white-fleck);
    border:2px dotted var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Courier Prime', monospace;
    font-size:9px;letter-spacing:0.5px;text-align:center;
    color:var(--ink-soft);
    transform:rotate(var(--tilt, 0deg));
    padding:6px;
    position:relative;
  }
  .stamp:nth-child(1){--tilt:-3deg;}
  .stamp:nth-child(2){--tilt:2deg;}
  .stamp:nth-child(3){--tilt:-2deg;}
  .stamp:nth-child(4){--tilt:3deg;}
  .stamp .stamp-mark{
    width:26px;height:26px;border-radius:50%;border:1.4px solid var(--postal-red);
    display:flex;align-items:center;justify-content:center;color:var(--postal-red);
    font-size:10px;margin-bottom:6px;
  }
  .stamps-caption{
    text-align:center;font-family:'Caveat', cursive;font-size:18px;color:var(--ink-soft);margin:14px 0 60px;
  }

  /* ---------- Section pages (paper cards) ---------- */
  .page{
    background:var(--paper-2);
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--paper-shadow), 0 18px 36px -24px rgba(36,43,46,0.35);
    padding:42px 38px 46px;
    margin:0 auto 34px;
    position:relative;
  }
  .page::before{ /* deckled top edge feel */
    content:"";position:absolute;top:-1px;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 16px);
    opacity:0.5;
  }
  @media (max-width:600px){ .page{padding:30px 20px 34px;} }

  .page-head{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
  .page-head .postmark{width:58px;height:58px;}
  .page-head .postmark .pm-text{font-size:6.5px;}
  .page-kicker{
    font-family:'Courier Prime', monospace;font-size:11px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--postal-red);margin:0 0 4px;
  }
  .page-title{
    font-family:'Fraunces', serif;font-weight:600;font-size:28px;margin:0;color:var(--ink);
  }
  .page-lede{
    font-family:'Caveat', cursive;font-weight:700;font-size:22px;color:var(--ink-soft);
    margin:-14px 0 24px;
  }

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px;}
  @media (max-width:600px){ .field-row{grid-template-columns:1fr;gap:18px;} }
  .field{margin-bottom:22px;}
  .field label{
    display:block;font-family:'Courier Prime', monospace;font-size:11.5px;
    letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;
  }
  .field label .req{color:var(--postal-red);}
  .field label .opt{font-style:normal;color:var(--line);font-family:'Source Serif 4',serif;text-transform:none;letter-spacing:0;}
  input[type="text"], input[type="email"], input[type="tel"], select, textarea{
    width:100%;
    background:transparent;
    border:none;border-bottom:1.5px solid var(--line);
    padding:9px 2px;
    font-family:'Source Serif 4', serif;font-size:16px;color:var(--ink);
    transition:border-color 0.15s ease;
  }
  input::placeholder, textarea::placeholder{color:#A9A08A;font-style:italic;}
  input:focus, select:focus, textarea:focus{
    outline:none;border-bottom-color:var(--postal-red);
  }
  select{appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position:calc(100% - 6px) center, calc(100% - 1px) center;
    background-size:6px 6px, 6px 6px;background-repeat:no-repeat;
    padding-right:20px;
  }
  select:invalid{color:#A9A08A;}

  .letter-area{
    background:
      repeating-linear-gradient(var(--paper-2) 0 33px, var(--line-soft) 33px 34px);
    border:1.5px solid var(--line);
    padding:16px 18px;
  }
  .letter-area textarea{
    border:none;width:100%;min-height:260px;resize:vertical;
    font-family:'Fraunces', serif;font-size:17px;line-height:34px;color:var(--ink);
    background:transparent;
  }
  .letter-area textarea:focus{outline:none;border:none;}
  .char-count{
    text-align:right;font-family:'Courier Prime', monospace;font-size:11px;color:var(--ink-soft);margin-top:8px;
  }
  .char-count.ok{color:var(--postal-green);}

  .choice-group{display:flex;gap:10px;flex-wrap:wrap;}
  .choice-pill{
    font-family:'Courier Prime', monospace;font-size:12.5px;letter-spacing:0.5px;
    border:1.5px solid var(--line);padding:9px 16px;cursor:pointer;
    color:var(--ink-soft);background:transparent;transition:all 0.15s ease;
  }
  .choice-pill.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .choice-pill:hover:not(.active){border-color:var(--postal-red);color:var(--postal-red);}

  .privacy-note{
    font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:20px;
    border-left:2px solid var(--line);padding-left:14px;
  }

  .error-text{color:var(--postal-red);font-size:12.5px;font-family:'Courier Prime',monospace;margin-top:6px;display:none;}
  .field.invalid input, .field.invalid select, .field.invalid textarea{border-bottom-color:var(--postal-red);}
  .field.invalid .error-text{display:block;}

  /* ---------- Submit ---------- */
  .submit-wrap{text-align:center;padding:10px 0 70px;}
  .submit-btn{
    font-family:'Courier Prime', monospace;font-size:15px;letter-spacing:2px;text-transform:uppercase;
    background:var(--postal-red);color:var(--paper);border:none;
    padding:19px 44px;cursor:pointer;transition:transform 0.15s ease, background 0.15s ease;
  }
  .submit-btn:hover{background:#8a3024;transform:translateY(-1px);}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .submit-hint{font-size:12.5px;color:var(--ink-soft);margin-top:12px;font-family:'Courier Prime',monospace;}

  /* ---------- Confirmation overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(36,43,46,0.92);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex;}
  .envelope-scene{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;}
  .envelope{
    width:220px;height:150px;background:var(--paper);position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .envelope::before{ /* flap */
    content:"";position:absolute;top:0;left:0;width:0;height:0;
    border-left:110px solid transparent;border-right:110px solid transparent;
    border-top:78px solid var(--paper-2);
    transform-origin:top;
    animation:flapClose 1.1s ease forwards;
  }
  @keyframes flapClose{
    0%{transform:rotateX(180deg);}
    100%{transform:rotateX(0deg);}
  }
  .wax-seal{
    position:absolute;top:26px;left:50%;transform:translateX(-50%) scale(0);
    width:46px;height:46px;border-radius:50%;background:var(--postal-red);
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:'Fraunces',serif;font-size:19px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    animation:sealStamp 0.4s ease 1.0s forwards;
    z-index:2;
  }
  @keyframes sealStamp{
    0%{transform:translateX(-50%) scale(2.6);opacity:0;}
    60%{transform:translateX(-50%) scale(0.9);opacity:1;}
    100%{transform:translateX(-50%) scale(1);opacity:1;}
  }
  .confirm-text{text-align:center;margin-top:38px;opacity:0;animation:fadeUp 0.6s ease 1.5s forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .confirm-title{font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:var(--paper);margin:0 0 14px;}
  .confirm-body{color:#D9D2C4;font-size:15px;max-width:360px;margin:0 auto;line-height:1.7;}
  .confirm-body .em{font-family:'Caveat',cursive;font-size:20px;color:var(--paper);display:block;margin-top:10px;}
  .confirm-sign{font-family:'Caveat',cursive;font-size:22px;color:var(--paper);margin-top:22px;}
  .close-overlay{
    margin-top:34px;background:none;border:1px solid #6b6f66;color:#D9D2C4;
    font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    padding:11px 24px;cursor:pointer;
  }
  .close-overlay:hover{border-color:var(--paper);color:var(--paper);}

  footer{
    text-align:center;padding:20px 0 60px;color:var(--ink-soft);font-size:12px;
    font-family:'Courier Prime',monospace;letter-spacing:0.5px;
  }

  /* ---------- A4 Letter Preview ---------- */
  .preview-overlay{align-items:flex-start;overflow-y:auto;padding:28px 16px 60px;}
  .preview-scene{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;}

  .preview-toolbar{
    width:100%;max-width:210mm;display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .preview-toolbar-label{
    font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:#B7BDAF;margin:0;
  }
  .ghost-btn{
    font-family:'Courier Prime', monospace;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;
    background:none;border:1px solid #6b6f66;color:#D9D2C4;padding:12px 20px;cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .ghost-btn:hover{border-color:var(--paper);color:var(--paper);}

  /* A4 aspect ratio (210mm x 297mm), scaled for screen */
  .a4-paper{
    width:100%;max-width:210mm;
    aspect-ratio:210 / 297;
    background:var(--paper);
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    padding:18mm 16mm;
    display:flex;flex-direction:column;
    font-family:'Source Serif 4', serif;color:var(--ink);
    overflow-y:auto;
    position:relative;
  }
  .a4-postmark{position:absolute;top:14mm;right:14mm;opacity:0.55;}
  .a4-postmark .postmark{width:56px;height:56px;}
  .a4-postmark .pm-text{font-size:6px;}

  .a4-date{
    font-family:'Courier Prime', monospace;font-size:12px;letter-spacing:0.5px;
    color:var(--ink-soft);margin-bottom:26px;
  }
  .a4-salutation{
    font-family:'Fraunces', serif;font-style:italic;font-weight:450;
    font-size:19px;margin:0 0 18px;color:var(--ink);
  }
  .a4-body{
    font-size:15.5px;line-height:1.85;white-space:pre-wrap;
    flex:1;color:var(--ink);
  }
  .a4-closing{margin-top:30px;}
  .a4-closing-line{font-family:'Fraunces', serif;font-style:italic;font-size:16px;margin:0 0 26px;color:var(--ink-soft);}
  .a4-signature{font-family:'Caveat', cursive;font-weight:700;font-size:30px;margin:0;color:var(--ink);}
  .a4-signature-sub{font-family:'Courier Prime', monospace;font-size:11.5px;color:var(--ink-soft);margin:4px 0 0;letter-spacing:0.3px;}

  .a4-footer{
    margin-top:24px;padding-top:14px;border-top:1px dashed var(--line);
  }
  .a4-footer-text{font-family:'Courier Prime', monospace;font-size:10px;letter-spacing:0.5px;color:var(--ink-soft);margin:0;}

  .a4-uni-stamp{
    position:absolute;
    right:14mm;bottom:14mm;
    width:118px;height:118px;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    opacity:0.82;
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .a4-uni-stamp-ring{
    position:absolute;inset:0;
    border:3px solid var(--postal-red);
    border-radius:50%;
  }
  .a4-uni-stamp-ring::before{
    content:"";position:absolute;inset:7px;
    border:1px solid var(--postal-red);border-radius:50%;
  }
  .a4-uni-stamp-text{
    position:relative;z-index:1;
    font-family:'Courier Prime', monospace;
    font-weight:700;
    font-size:9.5px;letter-spacing:1px;text-transform:uppercase;
    color:var(--postal-red);
    text-align:center;line-height:1.45;
    padding:16px;
  }
  @media (max-width:600px){
    .a4-uni-stamp{width:92px;height:92px;right:8mm;bottom:8mm;}
    .a4-uni-stamp-text{font-size:7.5px;padding:10px;}
  }

  .preview-actions{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap;justify-content:center;}

  @media (max-width:600px){
    .a4-paper{padding:12mm 10mm;aspect-ratio:auto;min-height:auto;}
    .a4-postmark{position:static;display:flex;justify-content:flex-end;margin-bottom:10px;}
  }

  @media print{
    body *{visibility:hidden;}
    #letterPreviewPaper, #letterPreviewPaper *{visibility:visible;}
    #letterPreviewPaper{
      position:absolute;top:0;left:0;width:100%;box-shadow:none;
      aspect-ratio:auto;padding:14mm;
    }
    .no-print{display:none !important;}
    .preview-overlay{position:static;background:none;padding:0;overflow:visible;}
    @page{size:A4;margin:0;}
  }
</style>
</head>
<body>

<header class="hero container">
  <div class="hero-postmark">
    <div class="postmark">
      <div class="pm-lines"></div>
      <div class="pm-text">GEAA<br>2026</div>
      <div class="pm-lines2"></div>
    </div>
  </div>
  <p class="eyebrow">Teachers' Day &nbsp;·&nbsp; 2026</p>
  <h1 class="title">Coming Soon.........</em></h1>
    <h1 class="title">05th September 2027 </em></h2>
